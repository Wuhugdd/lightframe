<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LightFrame - 像素画板</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div id="toastContainer"></div>

    <div class="container">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px;">
            <button class="btn btn-outline" style="padding: 8px 16px;" onclick="location.href='config.html'">
                ← 返回控制中心
            </button>
            <h2 style="margin: 0; border: none; font-size: 1rem; color: var(--gy);">像素画板</h2>
        </div>

        <div class="card">
            <h1>像素画板</h1>
            <p class="subtitle">在 32×8 矩阵上自由绘制，实时推送到 LightFrame 设备</p>

            <!-- 画板 -->
            <div class="draw-board">
                <div id="draw-grid"></div>
            </div>

            <!-- 工具栏 -->
            <div class="fg" style="margin-top: 20px;">
                <label class="lbl">画笔颜色</label>
                <div class="palette" id="palette">
                    <!-- 预设色块由 JS 生成 -->
                    <input type="color" id="custom-color" value="#ff0000"
                        style="width:28px;height:28px;border:none;padding:0;cursor:pointer;border-radius:6px;border:2px solid var(--bd);">
                </div>
            </div>

            <div class="fg">
                <label class="lbl">画笔大小</label>
                <div class="pg" data-group="brush">
                    <div class="pi sel" data-v="1" onclick="selectPill(this);brushSize=1">1×1</div>
                    <div class="pi" data-v="2" onclick="selectPill(this);brushSize=2">2×2</div>
                    <div class="pi" data-v="3" onclick="selectPill(this);brushSize=3">3×3</div>
                </div>
            </div>

            <!-- 操作按钮 -->
            <div style="display: flex; gap: 12px; flex-wrap: wrap; margin-top: 8px;">
                <button class="btn btn-outline" onclick="clearCanvas()">清空画板</button>
                <button class="btn btn-outline" onclick="fillCanvas()">填充当前色</button>
                <button class="btn btn-outline" onclick="invertCanvas()">反色</button>
                <div style="flex:1;"></div>
                <button class="btn" id="send-btn" onclick="sendToDevice()">推送到设备</button>
            </div>

            <!-- 设备 MAC 输入 -->
            <div class="fg" style="margin-top: 24px;">
                <label class="lbl">目标设备 MAC</label>
                <input type="text" id="device-mac" placeholder="例如：AA:BB:CC:DD:EE:FF 或 preview"
                    value="preview"
                    style="width:100%;padding:10px 14px;border:1px solid var(--bd);border-radius:10px;font-size:0.9rem;outline:none;background:var(--bg);">
                <div class="hint">填写设备 MAC 地址，或输入 preview 仅在本页预览</div>
            </div>
        </div>
    </div>

    <script>
        // ---- 状态 ----
        const COLS = 32, ROWS = 8;
        const pixels = new Array(COLS * ROWS).fill(null).map(() => [0, 0, 0]);
        let currentColor = [255, 0, 0];
        let brushSize = 1;
        let isPainting = false;

        const PRESETS = [
            '#ff0000','#ff6600','#ffcc00','#00cc44',
            '#0088ff','#8844ff','#ff44aa','#ffffff',
            '#aaaaaa','#555555','#000000',
        ];

        function hexToRgb(hex) {
            return [
                parseInt(hex.slice(1,3),16),
                parseInt(hex.slice(3,5),16),
                parseInt(hex.slice(5,7),16)
            ];
        }

        function rgbToHex(r,g,b) {
            return '#'+[r,g,b].map(v=>v.toString(16).padStart(2,'0')).join('');
        }

        // 初始化调色板
        const palette = document.getElementById('palette');
        PRESETS.forEach(hex => {
            const sw = document.createElement('div');
            sw.className = 'palette-swatch';
            sw.style.background = hex;
            sw.dataset.hex = hex;
            sw.onclick = () => setColor(hex, sw);
            palette.insertBefore(sw, palette.lastElementChild);
        });

        const customInput = document.getElementById('custom-color');
        customInput.oninput = () => setColor(customInput.value, null);

        function setColor(hex, swatchEl) {
            currentColor = hexToRgb(hex);
            customInput.value = rgbToHex(...currentColor);
            palette.querySelectorAll('.palette-swatch').forEach(s => s.classList.remove('active'));
            if (swatchEl) swatchEl.classList.add('active');
        }

        palette.querySelector('.palette-swatch').classList.add('active');

        // 初始化画板网格
        const grid = document.getElementById('draw-grid');
        const cellEls = [];
        for (let i = 0; i < ROWS * COLS; i++) {
            const cell = document.createElement('div');
            cell.className = 'draw-pixel';
            cell.dataset.idx = i;
            grid.appendChild(cell);
            cellEls.push(cell);
        }

        function updateCell(idx) {
            const [r,g,b] = pixels[idx];
            const bright = r>5||g>5||b>5;
            cellEls[idx].style.background = `rgb(${r},${g},${b})`;
            cellEls[idx].style.boxShadow = bright ? `0 0 5px rgba(${r},${g},${b},0.8)` : 'none';
        }

        function paintAt(idx) {
            const x = idx % COLS, y = Math.floor(idx / COLS);
            const half = Math.floor(brushSize / 2);
            for (let dy = -half; dy < brushSize-half; dy++) {
                for (let dx = -half; dx < brushSize-half; dx++) {
                    const nx=x+dx, ny=y+dy;
                    if (nx>=0&&nx<COLS&&ny>=0&&ny<ROWS) {
                        const ni = ny*COLS+nx;
                        pixels[ni] = [...currentColor];
                        updateCell(ni);
                    }
                }
            }
        }

        // 鼠标事件
        grid.addEventListener('mousedown', e => {
            if (e.button!==0) return;
            isPainting = true;
            const idx = parseInt(e.target.dataset.idx);
            if (!isNaN(idx)) paintAt(idx);
        });
        grid.addEventListener('mousemove', e => {
            if (!isPainting) return;
            const idx = parseInt(e.target.dataset.idx);
            if (!isNaN(idx)) paintAt(idx);
        });
        document.addEventListener('mouseup', () => { isPainting = false; });

        // 触摸支持
        grid.addEventListener('touchstart', e => { e.preventDefault(); isPainting=true; handleTouch(e); }, {passive:false});
        grid.addEventListener('touchmove', e => { e.preventDefault(); handleTouch(e); }, {passive:false});
        document.addEventListener('touchend', () => { isPainting=false; });
        function handleTouch(e) {
            const t = e.touches[0];
            const el = document.elementFromPoint(t.clientX, t.clientY);
            if (el && el.dataset.idx!==undefined) paintAt(parseInt(el.dataset.idx));
        }

        // 工具函数
        function selectPill(el) {
            el.closest('.pg').querySelectorAll('.pi').forEach(p=>p.classList.remove('sel'));
            el.classList.add('sel');
        }
        function clearCanvas() {
            for (let i=0;i<pixels.length;i++) { pixels[i]=[0,0,0]; updateCell(i); }
        }
        function fillCanvas() {
            for (let i=0;i<pixels.length;i++) { pixels[i]=[...currentColor]; updateCell(i); }
        }
        function invertCanvas() {
            for (let i=0;i<pixels.length;i++) { pixels[i]=pixels[i].map(v=>255-v); updateCell(i); }
        }

        // 发送到设备
        async function sendToDevice() {
            const mac = document.getElementById('device-mac').value.trim() || 'preview';
            const btn = document.getElementById('send-btn');
            btn.textContent = '推送中...';
            btn.style.opacity = '0.7';
            try {
                const res = await fetch('/api/draw', {
                    method: 'POST',
                    headers: {'Content-Type':'application/json'},
                    body: JSON.stringify({mac, pixels})
                });
                const data = await res.json();
                showToast(data.success ? '已推送到设备 '+mac : '推送失败', data.success?'success':'error');
            } catch(e) {
                showToast('网络请求失败，请检查后端是否运行', 'error');
            } finally {
                btn.textContent = '推送到设备';
                btn.style.opacity = '1';
            }
        }

        function showToast(msg, type='success') {
            const c = document.getElementById('toastContainer');
            const t = document.createElement('div');
            t.className = `toast toast-${type}`;
            t.textContent = msg;
            c.appendChild(t);
            requestAnimationFrame(()=>t.classList.add('show'));
            setTimeout(()=>{ t.classList.remove('show'); setTimeout(()=>t.remove(),300); },3000);
        }
    </script>
</body>
</html>
