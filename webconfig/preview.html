<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LightFrame 在线预览</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <h1>LightFrame 在线预览</h1>

    <div class="card">
        <h2>预览 (8x32)</h2>
        <div id="preview-grid">
            <!-- 动态生成 -->
        </div>
        <button id="refresh-btn">刷新预览</button>
    </div>

    <div class="card">
        <h2>选择模式</h2>
        <select id="mode-select">
            <option value="">加载中...</option>
        </select>
    </div>

    <script>
        const WIDTH = 32;  // 32列横向
        const HEIGHT = 8;   // 8行纵向
        let pixels = [];

        // 创建预览网格：LED矩阵是 8高 × 32宽，所以预览也是 32宽 × 8高
        const grid = document.getElementById('preview-grid');
        for (let y = 0; y < HEIGHT; y++) {
            for (let x = 0; x < WIDTH; x++) {
                const pixel = document.createElement('div');
                pixel.className = 'preview-pixel';
                pixel.style.background = '#000';
                grid.appendChild(pixel);
                pixels.push(pixel);
            }
        }

        async function loadModes() {
            const res = await fetch('/api/modes');
            const data = await res.json();
            const select = document.getElementById('mode-select');
            select.innerHTML = '';
            data.modes.forEach(mode => {
                const opt = document.createElement('option');
                opt.value = mode.mode_id;
                opt.textContent = `${mode.display_name} (${mode.mode_id})`;
                select.appendChild(opt);
            });
        }

        async function refreshPreview() {
            const mode = document.getElementById('mode-select').value;
            if (!mode) return;

            // 这里 mac 用测试地址
            const res = await fetch(`/api/frame?mac=preview&mode=${mode}`);
            const buffer = await res.arrayBuffer();
            const bytes = new Uint8Array(buffer);

            // 后端帧顺序：y * WIDTH + x，其中 WIDTH=8（LED宽度）
            // 预览是 32宽 × 8高，每个像素对应正确位置
            for (let y = 0; y < 8; y++) {
                for (let x = 0; x < 32; x++) {
                    // 后端：32行 × 8列
                    // 预览：8行 × 32列，需要转置
                    const idx = (x * 8 + y) * 3;
                    if (idx + 2 < bytes.length) {
                        const r = bytes[idx];
                        const g = bytes[idx + 1];
                        const b = bytes[idx + 2];
                        const pixelIdx = y * 32 + x;
                        pixels[pixelIdx].style.background = `rgb(${r}, ${g}, ${b})`;
                    }
                }
            }
        }

        document.getElementById('refresh-btn').onclick = refreshPreview;

        loadModes();
        setInterval(refreshPreview, 100); // 自动刷新
    </script>
</body>

</html>
